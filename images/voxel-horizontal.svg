<title id="_R_4eklubsnmlb_-title">3 × 3 voxel layer drawn as cubes with one measurement path</title>
<desc id="_R_4eklubsnmlb_-desc">Nine cubes p1 to p9, numbered row by row. A horizontal path through row 2 crosses p4, p5 and p6 at mid-height and ends at observation Y2. The other six voxels are off the path. Axis triad: x runs along columns, y along rows, z up.</desc>
